rabbitmq:
  enabled: true
  replicaCount: 3

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  tsc:
    enabled: true

  image:
    tag: 4.3.4

  hosts:
    management: dev-moti-rabbitmq.apps.gold.devops.gov.bc.ca
    stomp: dev-moti-rabbitmq-stomp.apps.gold.devops.gov.bc.ca

  resources:
    requests:
      cpu: 0.15
      memory: 512Mi

allowedNamespace:
  - name: fb3c60
    environment: dev
