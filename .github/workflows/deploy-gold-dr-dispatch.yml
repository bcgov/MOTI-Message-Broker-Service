name: Deploy Gold & GoldDR Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      cluster:
        type: choice
        description: OpenShift Cluster
        options: 
        - gold
        - golddr
        - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gold:
    if: ${{ github.event.inputs.cluster == 'gold' || github.event.inputs.cluster == 'both' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: gold-${{ inputs.environment }}
      url: ${{ inputs.environment == 'prod' && 'https://moti-rabbitmq.apps.gold.devops.gov.bc.ca' || inputs.environment == 'test' && 'https://test-moti-rabbitmq.apps.gold.devops.gov.bc.ca' || 'https://dev-moti-rabbitmq.apps.gold.devops.gov.bc.ca' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Authenticate and set context
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156
      with:
        openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ vars.OPENSHIFT_NAMESPACE }}
        insecure_skip_tls_verify: true

    - name: Deploy apps with Helm chart
      run: |
        make upgrade \
        CLUSTER=gold \
        NAMESPACE=${{ vars.OPENSHIFT_NAMESPACE }}
      working-directory: ./helm/main

  deploy-golddr:
    if: ${{ github.event.inputs.cluster == 'golddr' || github.event.inputs.cluster == 'both' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: golddr-${{ inputs.environment }}
      url: ${{ inputs.environment == 'prod' && 'https://moti-rabbitmq.apps.golddr.devops.gov.bc.ca' || inputs.environment == 'test' && 'https://test-moti-rabbitmq.apps.golddr.devops.gov.bc.ca' || 'https://dev-moti-rabbitmq.apps.golddr.devops.gov.bc.ca' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Authenticate and set context
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156
      with:
        openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ vars.OPENSHIFT_NAMESPACE }}
        insecure_skip_tls_verify: true

    - name: Deploy apps with Helm chart
      run: |
        make upgrade \
        CLUSTER=golddr \
        NAMESPACE=${{ vars.OPENSHIFT_NAMESPACE }}
      working-directory: ./helm/main
